</style></head><body><header><a class="logo" href="index.html">🗳️ פיצת יום הבוחר</a><span>ניהול הזמנות</span><form id="logoutForm"><button class="nav">נעילת אזור הניהול 🔒</button></form></header><main><section class="card" id="loginPanel" style="max-width:480px;margin:30px auto"><h1 style="font-size:29px">🔒 ניהול הזמנות</h1><p>פיצת יום הבוחר</p><form id="adminLogin"><label for="password">סיסמת ניהול</label><input id="password" name="password" type="password" required autocomplete="current-password" maxlength="200" style="display:block;width:100%;margin:12px 0"><button class="primary">כניסה לניהול</button></form><p id="loginStatus" role="status" class="hint"></p></section><section id="summary" class="summary" hidden><div class="summaryhead"><div><span class="tag">הכול במקום אחד</span><h2>ניהול כל ההזמנות</h2></div><button id="export" class="primary" disabled>הורדת סיכום לאקסל ↓</button></div><p id="adminStatus" role="status"></p><button id="refresh" class="addpizza">רענון הזמנות ↻</button><button id="importOld" class="addpizza" hidden>יבוא הזמנות קודמות מהדפדפן הזה</button><div id="stats" class="stats"></div><div id="breakdown"></div><div class="adminfilters"><label for="searchOrders">חיפוש לפי שם לקוח<input type="search" id="searchOrders" placeholder="הקלידו שם לקוח…" autocomplete="off"></label><p id="shownCount" class="hint" aria-live="polite"></p></div><div class="tablewrap admin-table"><table><thead><tr><th>תאריך ושעה</th><th>שם לקוח</th><th>פיצות</th><th>הרכב הפיצה</th><th>שתייה</th><th>תפוח אדמה מוקרם</th><th>פעולות</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" class="empty">עדיין אין הזמנות. ההזמנה הראשונה תופיע כאן.</p><p class="hint">מסך ניהול מוגן. כאן מוצגות ההזמנות שנשמרו באתר מכל המכשירים.</p></section></main><script>const $=id=>document.getElementById(id),TOPS=['זיתים','פטריות','תירס','בצל','גמבה אדומה','עגבניות'],EMOJI=['🫒','🍄','🌽','🧅','🫑','🍅'],DRINKS=['קולה','סודה','מים','ענבים','אייס קפה','ברד','ZERO','תפוזים','בירה'],KEY='bella-orders-v2';let orders=[];function getTotals(data=orders){return{customers:new Set(data.map(o=>o.name.trim())).size,pizzas:data.reduce((s,o)=>s+o.pizzas,0),potato:data.reduce((s,o)=>s+o.potato,0),drinks:DRINKS.map((_,i)=>data.reduce((s,o)=>s+o.drinks[i],0))}}function composition(o){return o.pizzas?TOPS.map((t,i)=>o.tops[i]!=='ללא'?t+' — '+o.tops[i]:null).filter(Boolean).join(', ')||'ללא תוספות':'—'}function drinkText(o){return DRINKS.map((t,i)=>o.drinks[i]?t+' × '+o.drinks[i]:null).filter(Boolean).join(', ')||'—'}function render(){const t=getTotals();$('stats').innerHTML=[['לקוחות',t.customers],['פיצות',t.pizzas],['יחידות שתייה',t.drinks.reduce((a,b)=>a+b,0)],['מנות תפוח אדמה',t.potato]].map(([label,n])=>`<div class="stat"><b>${n}</b><span>${label}</span></div>`).join('');$('breakdown').innerHTML='<div class="chips">'+DRINKS.map((d,i)=>`<span class="chip">${d}: <b>${t.drinks[i]}</b></span>`).join('')+'</div>';$('rows').replaceChildren();const query=$('searchOrders').value.trim().toLowerCase();const visible=orders.filter(o=>o.name.toLowerCase().includes(query));$('shownCount').textContent='מוצגות '+visible.length+' מתוך '+orders.length+' שורות הזמנה';visible.forEach((o,i)=>{const tr=document.createElement('tr');[o.createdAt?new Date(o.createdAt).toLocaleString('he-IL',{timeZone:'Asia/Jerusalem',dateStyle:'short',timeStyle:'short'}):'—',o.name,o.pizzas,composition(o),drinkText(o),o.potato].forEach((v,index)=>{const td=document.createElement('td');td.dataset.label=['תאריך ושעה','שם לקוח','פיצות','הרכב הפיצה','שתייה','תפוח אדמה מוקרם'][index];td.textContent=v;tr.append(td)});const td=document.createElement('td'),btn=document.createElement('button');td.dataset.label='פעולות';btn.textContent='הסרה';btn.setAttribute('aria-label','הסרת ההזמנה של '+o.name);btn.onclick=()=>{removeOrder(o.id)};td.append(btn);tr.append(td);$('rows').append(tr)});$('empty').hidden=!!orders.length;$('export').disabled=!orders.length}// Minimal OOXML workbook export, stored ZIP entries; no network dependency.
const xml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c])).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,'');function column(n){let r='';for(n++;n;n=Math.floor((n-1)/26))r=String.fromCharCode(65+(n-1)%26)+r;return r}function sheet(rows){return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0" rightToLeft="1"/></sheetViews><cols><col min="1" max="1" width="25" customWidth="1"/><col min="2" max="20" width="22" customWidth="1"/></cols><sheetData>'+rows.map((r,i)=>'<row r="'+(i+1)+'">'+r.map((v,j)=>'<c r="'+column(j)+(i+1)+'"'+(typeof v==='number'?'':' t="inlineStr"')+' s="'+(i===0?1:0)+'">'+(typeof v==='number'?'<v>'+v+'</v>':'<is><t xml:space="preserve">'+xml(v)+'</t></is>')+'</c>').join('')+'</row>').join('')+'</sheetData></worksheet>'}function crc32(b){let c=0xffffffff;for(const n of b){c^=n;for(let k=0;k<8;k++)c=c&1?(c>>>1)^0xedb88320:c>>>1}return(c^0xffffffff)>>>0}function zip(files){const enc=new TextEncoder(),parts=[],central=[];let offset=0,total=0;for(const [name,text]of Object.entries(files)){const n=enc.encode(name),b=enc.encode(text),crc=crc32(b),h=new Uint8Array(30+n.length),v=new DataView(h.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint32(14,crc,true);v.setUint32(18,b.length,true);v.setUint32(22,b.length,true);v.setUint16(26,n.length,true);h.set(n,30);parts.push(h,b);const c=new Uint8Array(46+n.length),d=new DataView(c.buffer);d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint32(16,crc,true);d.setUint32(20,b.length,true);d.setUint32(24,b.length,true);d.setUint16(28,n.length,true);d.setUint32(42,offset,true);c.set(n,46);central.push(c);offset+=h.length+b.length;total+=c.length}const end=new Uint8Array(22),d=new DataView(end.buffer);d.setUint32(0,0x06054b50,true);d.setUint16(8,central.length,true);d.setUint16(10,central.length,true);d.setUint32(12,total,true);d.setUint32(16,offset,true);return new Blob([...parts,...central,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}function workbook(data){const t=getTotals(data),summary=[['פריט','כמות'],['לקוחות',t.customers],['פיצות',t.pizzas],...DRINKS.map((d,i)=>[d,t.drinks[i]]),['סה״כ יחידות שתייה',t.drinks.reduce((a,b)=>a+b,0)],['תפוח אדמה מוקרם',t.potato]],detail=[['שם לקוח','כמות פיצות',...TOPS,...DRINKS,'תפוח אדמה מוקרם'],...data.map(o=>[o.name,o.pizzas,...o.tops.map(v=>o.pizzas?v:'—'),...o.drinks,o.potato])],toppingSummary=[['תוספת','על כל הפיצה — כמות פיצות','חצי ימין — כמות פיצות','חצי שמאל — כמות פיצות'],...TOPS.map((t,i)=>[t,...['כל הפיצה','חצי ימין','חצי שמאל'].map(side=>data.reduce((s,o)=>s+(o.tops[i]===side?o.pizzas:0),0))])];const files={'[Content_Types].xml':'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+[1,2,3].map(i=>'<Override PartName="/xl/worksheets/sheet'+i+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+'</Types>','_rels/.rels':'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>','xl/workbook.xml':'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+['סיכום כמויות','פירוט הזמנות','סיכום תוספות'].map((n,i)=>'<sheet name="'+n+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets></workbook>','xl/_rels/workbook.xml.rels':'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+[1,2,3].map(i=>'<Relationship Id="rId'+i+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+i+'.xml"/>').join('')+'<Relationship Id="rId4" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>','xl/styles.xml':'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Arial"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Arial"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF51418C"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="2"><xf fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment horizontal="right" readingOrder="2"/></xf><xf fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment horizontal="right" readingOrder="2" wrapText="1"/></xf></cellXfs></styleSheet>','xl/worksheets/sheet1.xml':sheet(summary),'xl/worksheets/sheet2.xml':sheet(detail),'xl/worksheets/sheet3.xml':sheet(toppingSummary)};return zip(files)}
async function loadOrders(){try{$('adminStatus').textContent='טוענים הזמנות…';const r=await fetch('/api/orders',{cache:'no-store'});if(r.status===401||r.status===403){showLogin('נדרשת כניסה מורשית וסיסמת ניהול.');return}if(!r.ok)throw Error('לא ניתן לטעון הזמנות. בדקו את הגדרת רכיב השרת.');orders=(await r.json()).orders;$('loginPanel').hidden=true;$('summary').hidden=false;render();$('adminStatus').textContent='הנתונים עודכנו';}catch(e){$('adminStatus').textContent=e.message}}
async function removeOrder(id){if(!confirm('להסיר את שורת ההזמנה?'))return;const r=await fetch('/api/orders/'+encodeURIComponent(id),{method:'DELETE'});if(!r.ok){$('adminStatus').textContent='ההסרה נכשלה';return}await loadOrders()}
$('refresh').onclick=loadOrders;$('searchOrders').oninput=render;
$('export').onclick=()=>{if(!orders.length)return;const url=URL.createObjectURL(workbook(orders)),a=document.createElement('a');a.href=url;a.download='election-pizza-orders-'+new Date().toISOString().slice(0,10)+'.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
let old=[];try{old=JSON.parse(localStorage.getItem('bella-orders-v2')||'[]')}catch{}if(Array.isArray(old)&&old.length){$('importOld').hidden=false;$('importOld').onclick=async()=>{const key='election-import-id';let id=localStorage.getItem(key);if(!id){id=crypto.randomUUID();localStorage.setItem(key,id)}const normalized=old.map(o=>({...o,drinks:Array.from({length:DRINKS.length},(_,i)=>o.drinks[i]||0)}));const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requestId:id,orders:normalized})});if(r.ok){localStorage.removeItem('bella-orders-v2');$('importOld').hidden=true;loadOrders()}else $('adminStatus').textContent='יבוא ההזמנות נכשל';}}


function showLogin(message){$('loginPanel').hidden=false;$('summary').hidden=true;$('loginStatus').textContent=message;orders=[];$('rows').replaceChildren();}
$('adminLogin').onsubmit=async event=>{event.preventDefault();const button=event.target.querySelector('button');button.disabled=true;try{const response=await fetch('/api/admin/login',{method:'POST',body:new URLSearchParams(new FormData(event.target))});if(response.ok){event.target.reset();await loadOrders()}else{let result;try{result=await response.json()}catch{}showLogin(result?.message||'הכניסה נכשלה. בדקו סיסמה והרשאות.')}}catch{showLogin('לא ניתן להתחבר לשרת. העלו את החבילה המלאה לפי ההוראות.')}finally{button.disabled=false}};
$('logoutForm').onsubmit=async event=>{event.preventDefault();try{await fetch('/api/admin/logout',{method:'POST'})}finally{showLogin('אזור הניהול ננעל.')}};
if(location.protocol==='file:')showLogin('לניהול הזמנות מכל המכשירים יש להפעיל את רכיב השרת המצורף. הנתונים אינם נשמרים בקובץ HTML.');else loadOrders();
</script></body></html>
